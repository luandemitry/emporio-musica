[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer support agent for Empório da Música (AI Engineer technical challenge)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tzdata; sys_platform == 'win32'",  # zoneinfo has no system tz database on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ingest = ["pdfplumber>=0.11"]  # only to regenerate data/politicas_da_loja.md from the PDF

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
