[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer support agent for Empório da Música (AI Engineer technical challenge)"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]  # single source of truth: requirements.txt

[project.scripts]
emporio = "emporio.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
ingest = ["pdfplumber>=0.11"]  # only to regenerate data/politicas_da_loja.md from the PDF

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"emporio.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # so `pytest` works without installing the package
